name: v15 experiment certificates

on:
  push:
    paths:
      - "artifact/finite_toy_delivery_extension/**"
      - "artifact/process_route_stress_fixture/**"
      - "artifact/reviewer_revision_v77/**"
      - "reproduce_v15_experiments.py"
      - "scripts/verify_manifest.py"
      - "artifact/build_manifest.mjs"
      - "MANIFEST.sha256"
      - "artifact/MANIFEST.sha256"
      - ".github/workflows/v15-experiment-certificates.yml"
  pull_request:
    paths:
      - "artifact/finite_toy_delivery_extension/**"
      - "artifact/process_route_stress_fixture/**"
      - "artifact/reviewer_revision_v77/**"
      - "reproduce_v15_experiments.py"
      - "scripts/verify_manifest.py"
      - "artifact/build_manifest.mjs"
      - "MANIFEST.sha256"
      - "artifact/MANIFEST.sha256"
      - ".github/workflows/v15-experiment-certificates.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify v15 experiment certificates
        run: python reproduce_v15_experiments.py
