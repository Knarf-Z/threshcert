name: cross-platform-reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen manifest before generating files
        run: python scripts/build-manifest.py --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile and type-check
        run: npm run typecheck
      - name: Run contract tests
        run: npm test
      - name: Generate scenarios
        run: npm run scenarios
      - name: Verify frozen results independently
        run: npm run verify:results
